<!Document>
<html>
	<head>
		<title>Лабораторные работы</title>
		<link rel="stylesheet" href="style.css">

		<script defer src="lab1.js"></script>
		<script src="general.js"></script>
	</head>
	<body>		
		<div class="flex row" id="first">
			<div class="block_1 block column flex">

				<div id="header">
					<span class="bigT">Задача 1</span>
					<div style="padding: 6px; background: #222; font-size:1.2rem; width: fit-content; margin-top: var(--mm);">
						<input type="checkbox" name="extendedInfo" id="extendedInfo">
						<span>Выводить расширенные данные</span>
					</div>
				</div>

				<div class="flex row" id="userinputlab1">
					<div class="flex column">
						<span class="okT">Максимальное количество чисел</span>
						<input type="text" id="nmax" class="smallInput" value="1000">
					</div>
					<div class="flex column">
						<span class="okT">Максимальный модуль числа</span>
						<input type="text" id="mmax" class="smallInput" value="10^9">
					</div>
				</div>

				<input class="userInput okT" type="text" id="lab1_input">
				<div id="result1" class="resultBlock okT"></div>

				<button class="okT" id="test">Подтвердить</button>
				<button id="button_1" class="okT">Провести юнит-тесты</button>

				<a class="okT" style="color: white;" href="index.html">⊲ Вернуться к списку лабораторных</a>
			</div>

			<div class="flex column" id="unitTestBlock">
				
			</div>

			<template id="unittest1">
				<div class="block gap flex column">
					<span class="okT"></span>
					<div class="resultBlock okT"></div>
				</div>
			</template>
		</div>
	</body>
</html>
